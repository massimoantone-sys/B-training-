<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>B training — Coaching & Performance</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-2: #18181d;
      --surface-3: #222229;
      --border: #27272f;
      --border-strong: #383844;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --orange: #f97316;
      --orange-hover: #ea580c;
      --amber: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* En-tête */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--orange), var(--amber));
      color: #09090b;
      font-weight: 900;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 900;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
    }

    .sync-badge.live {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Conteneurs */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px 96px;
      width: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .card-sub {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    /* Boutons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--orange), var(--amber));
      color: #09090b;
      font-weight: 800;
    }

    .btn-secondary {
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      color: var(--text);
    }

    .btn-ghost-orange {
      background: rgba(249, 115, 22, 0.14);
      border: 1px solid rgba(249, 115, 22, 0.38);
      color: #fdba74;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    .btn-full {
      width: 100%;
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--orange);
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill-orange {
      background: rgba(249, 115, 22, 0.15);
      color: #fdba74;
      border: 1px solid rgba(249, 115, 22, 0.32);
    }

    .pill-green {
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .pill-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.32);
    }

    .pill-zinc {
      background: var(--surface-3);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Grilles */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 860px) {
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    /* Écran connexion */
    .login-wrap {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
    }

    .tab-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
    }

    .tab-switch button {
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-muted);
    }

    .tab-switch button.active {
      background: linear-gradient(135deg, var(--orange), var(--amber));
      color: #09090b;
    }

    /* Navigation Coach (Desktop top + Mobile bottom) */
    .coach-nav-desktop {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 16px;
    }

    .coach-nav-desktop button {
      padding: 10px 8px;
      border-radius: 11px;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .coach-nav-desktop button.active {
      background: linear-gradient(135deg, var(--orange), var(--amber));
      color: #09090b;
    }

    .coach-nav-mobile {
      display: none;
    }

    @media (max-width: 680px) {
      .coach-nav-desktop { display: none; }
      .coach-nav-mobile {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 25;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        background: rgba(9, 9, 11, 0.97);
        border-top: 1px solid var(--border);
        padding: 7px 6px calc(7px + env(safe-area-inset-bottom, 0px));
      }
      .coach-nav-mobile button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 6px 2px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
      }
      .coach-nav-mobile button.active {
        background: rgba(249, 115, 22, 0.18);
        color: #fdba74;
        border: 1px solid rgba(249, 115, 22, 0.35);
      }
    }

    /* Barre progression */
    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--amber));
      transition: width 0.25s ease;
    }

    /* Cases séries athlète */
    .set-box {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border-radius: var(--radius-md);
      background: var(--bg);
      border: 1px solid var(--border);
      text-align: left;
    }

    .set-box.done {
      background: rgba(249, 115, 22, 0.14);
      border-color: rgba(249, 115, 22, 0.5);
    }

    .set-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      flex-shrink: 0;
    }

    .set-box.done .set-check {
      background: var(--orange);
      border-color: var(--orange);
      color: #09090b;
    }

    /* Chronomètre flottant */
    .rest-widget {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      width: calc(100% - 24px);
      max-width: 440px;
      background: rgba(18, 18, 22, 0.98);
      border: 1px solid rgba(249, 115, 22, 0.6);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
    }

    .rest-widget.hidden { display: none; }

    /* Modale */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 620px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 18px;
    }

    /* Toast */
    .toast-wrap {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      width: calc(100% - 28px);
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--surface-2);
      border: 1px solid rgba(249, 115, 22, 0.55);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toast.err {
      border-color: rgba(239, 68, 68, 0.65);
      color: #fecaca;
    }

    .alert-box {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    .scroll-list {
      max-height: 330px;
      overflow-y: auto;
      padding-right: 4px;
    }
  </style>
</head>

      function loadArray(key, fallback) {
        const raw = readStore(key);
        if (!raw) return JSON.parse(JSON.stringify(fallback));
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length > 0 ? parsed : JSON.parse(JSON.stringify(fallback));
        } catch (e) {
          return JSON.parse(JSON.stringify(fallback));
        }
      }

      let checkins = loadArray(KEYS.CHECKINS, DEFAULT_CHECKINS);

      function guaranteeDefaults() {
        if (!Array.isArray(gyms) || gyms.length === 0) gyms = JSON.parse(JSON.stringify(DEFAULT_GYMS));
        if (!Array.isArray(exercises) || exercises.length === 0) exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
        if (!Array.isArray(athletes) || athletes.length === 0) {
          athletes = JSON.parse(JSON.stringify(DEFAULT_ATHLETES));
        } else {
          for (const d of DEFAULT_ATHLETES) {
            if (!athletes.some((a) => (a.code || "").toUpperCase() === d.code)) {
              athletes.push(JSON.parse(JSON.stringify(d)));
            }
          }

        if (!Array.isArray(checkins) || checkins.length === 0) checkins = JSON.parse(JSON.stringify(DEFAULT_CHECKINS));

      // Normalise chaque document de bilan (compatibilité anciens documents Firestore anglais / français)
      function normalizeCheckin(raw) {
        if (!raw || typeof raw !== "object") return null;
        const athleteId = raw.athleteId || raw.athId || "";
        const linkedAth = athletes.find((a) => a.id === athleteId);
        const athleteName =
          raw.athleteName ||
          raw.nom ||
          (linkedAth ? linkedAth.nom : "") ||
          (athleteId.includes("lucas") ? "Lucas Moreau" : athleteId.includes("chloe") ? "Chloé Laurent" : athleteId.includes("max") ? "Maxime Bernard" : "Athlète");

        const poidsVal = raw.poids !== undefined && raw.poids !== null && raw.poids !== "" ? raw.poids : raw.weight;
        const mgVal = raw.masseGrasse !== undefined && raw.masseGrasse !== null && raw.masseGrasse !== "" ? raw.masseGrasse : (raw.bodyFat ?? raw.mg);
        const kcalVal = raw.calories !== undefined && raw.calories !== null && raw.calories !== "" ? raw.calories : raw.kcal;
        const protVal = raw.proteines !== undefined && raw.proteines !== null && raw.proteines !== "" ? raw.proteines : (raw.protein ?? raw.prot);
        const formeVal = raw.forme !== undefined && raw.forme !== null && raw.forme !== "" ? raw.forme : raw.energy;
        const notesVal = String(raw.notes ?? raw.note ?? "").trim();

        return {
          id: raw.id || "chk-" + Math.random().toString(36).slice(2, 9),
          athleteId: linkedAth ? linkedAth.id : athleteId,
          athleteName,
          date: raw.date || new Date().toISOString().slice(0, 10),
          poids: poidsVal !== undefined && poidsVal !== null && poidsVal !== "" ? Number(poidsVal) : null,
          masseGrasse: mgVal !== undefined && mgVal !== null && mgVal !== "" ? Number(mgVal) : null,

          forme: formeVal !== undefined && formeVal !== null && formeVal !== "" ? Number(formeVal) : null,

      }

      function calcProgress(ath) {
        if (!ath || !Array.isArray(ath.exercices) || ath.exercices.length === 0) return 0;
        let total = 0;
        let done = 0;
        for (const item of ath.exercices) {
          const n = Number(item.series) || 0;
          total += n;
          for (let i = 0; i < n; i++) {
            if (item.faites && item.faites[i]) done++;
          }
        }
        return total === 0 ? 0 : Math.round((done / total) * 100);
      }

      function toast(msg, isErr) {
        const wrap = document.getElementById("toast-wrap");
        if (!wrap) return;
        const el = document.createElement("div");
        el.className = "toast" + (isErr ? " err" : "");
        el.innerHTML = `<span>${esc(msg)}</span><button type="button" data-action="dismiss-toast" style="color:#a1a1aa;font-weight:900;">✕</button>`;
        wrap.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 3400);
      }

      let timerId = null;

      function fmtSec(s) {
        const v = Math.max(0, Math.floor(s));
        return String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      }

      function paintTimer() {
        const t = document.getElementById("rest-time");
        const b = document.getElementById("rest-bar");
        if (t) t.textContent = fmtSec(timerLeft);
        if (b) b.style.width = (timerTotal > 0 ? Math.max(0, Math.min(100, (timerLeft / timerTotal) * 100)) : 0) + "%";
      }

      function beep() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ctx = new AC();
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.frequency.value = 880;
          g.gain.setValueAtTime(0.12, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      function startTimer(sec, label) {
        stopTimer(true);
        timerTotal = Math.max(10, Number(sec) || 90);
        timerLeft = timerTotal;
        const w = document.getElementById("rest-widget");
        const l = document.getElementById("rest-label");
        if (l) l.textContent = label || "Série validée";
        if (w) w.classList.remove("hidden");
        paintTimer();

        timerId = setInterval(() => {
          timerLeft -= 1;
          paintTimer();
          if (timerLeft <= 0) {
            stopTimer(false);
            beep();
            toast("Repos terminé ! Place à la série suivante.");
          }
        }, 1000);
      }

      function stopTimer(silent) {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        const w = document.getElementById("rest-widget");
        if (w && !silent) w.classList.add("hidden");
      }

      function render() {
        const root = document.getElementById("app");
        if (!root) return;
        let view = "";

        else view = renderAthlete();
        root.innerHTML = renderTopbar() + view;
      }

      // =========================================================================
      // 7. DÉLÉGATION D'ÉVÉNEMENTS UNIQUE SUR DOCUMENT.BODY (ZÉRO BLOCAGE)
      // =========================================================================
      document.body.addEventListener("click", function (e) {
        const target = e.target.closest("[data-action]");
        if (!target) return;
        const action = target.getAttribute("data-action");

        if (action === "dismiss-toast") {
          const t = target.closest(".toast");
          if (t) t.remove();
        } else if (action === "close-modal-backdrop") {
          if (e.target === target) closeModal();
        } else if (action === "close-modal") {
          closeModal();
        } else if (action === "login-tab") {
          state.loginTab = target.getAttribute("data-tab");
          state.loginError = "";
          render();
        } else if (action === "quick-coach") {
          guaranteeDefaults();
          state.loginError = "";
          state.role = "coach";
          state.coachTab = "athletes";
          render();
          toast("Connecté à l'Espace Coach !");
        } else if (action === "quick-athlete") {
          guaranteeDefaults();
          const code = (target.getAttribute("data-code") || "").toUpperCase();
          const found = athletes.find((a) => a.code.toUpperCase() === code) || athletes[0];
          state.loginError = "";
          state.role = "athlete";
          state.athleteId = found.id;
          state.athleteTab = "workout";
          render();
          toast("Bienvenue " + found.nom + " !");
        } else if (action === "logout") {
          stopTimer(false);
          state.role = null;
          state.loginError = "";
          render();
        } else if (action === "coach-tab") {
          state.coachTab = target.getAttribute("data-tab");
          if (state.coachTab === "builder") draft = makeDraft(state.builderAthleteId);
          render();
          window.scrollTo(0, 0);
        } else if (action === "athlete-tab") {
          state.athleteTab = target.getAttribute("data-tab");
          render();
        } else if (action === "copy-code") {
          const code = target.getAttribute("data-code");
          try {
            const ta = document.createElement("textarea");
            ta.value = code;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (err) {}
          toast("Code " + code + " copié !");
        } else if (action === "go-builder") {
          const id = target.getAttribute("data-athlete-id");
          state.builderAthleteId = id;
          draft = makeDraft(id);
          state.coachTab = "builder";
          render();
          window.scrollTo(0, 0);
        } else if (action === "go-tracking") {
          state.trackingAthleteId = target.getAttribute("data-athlete-id");
          state.coachTab = "tracking";
          render();
          window.scrollTo(0, 0);
        } else if (action === "delete-checkin") {
          const chkId = target.getAttribute("data-checkin-id");
          checkins = checkins.filter((c) => c.id !== chkId);
          writeStore(KEYS.CHECKINS, JSON.stringify(checkins));
          if (window.btFirebaseDelete && chkId) {
            window.btFirebaseDelete("checkins", chkId);
          }
          render();
          toast("Bilan supprimé.");
        } else if (action === "builder-muscle") {
          state.builderMuscle = target.getAttribute("data-muscle");
          render();
        } else if (action === "catalog-muscle") {
          state.catalogMuscle = target.getAttribute("data-muscle");
          render();
        } else if (action === "select-gym") {
          state.selectedGymId = target.getAttribute("data-gym-id");
          render();
        } else if (action === "draft-add") {
          const ex = getEx(target.getAttribute("data-ex-id"));
          draft.exercices.push({
            exId: ex.id,
            series: ex.series || 3,
            reps: ex.reps || "10-12",
            charge: ex.charge || "Adaptée",
            repos: ex.repos || 90,
            faites: Array(ex.series || 3).fill(false)
          });
          render();
          toast("« " + ex.nom + " » ajouté.");
        } else if (action === "draft-remove") {
          const idx = Number(target.getAttribute("data-idx"));
          draft.exercices.splice(idx, 1);
          render();
        } else if (action === "draft-move") {
          const idx = Number(target.getAttribute("data-idx"));
          const dir = Number(target.getAttribute("data-dir"));
          const to = idx + dir;
          if (to >= 0 && to < draft.exercices.length) {
            const tmp = draft.exercices[idx];
            draft.exercices[idx] = draft.exercices[to];
            draft.exercices[to] = tmp;
            render();
          }
        } else if (action === "compose-workout") {
          const ath = athletes.find((a) => a.id === draft.athleteId) || athletes[0];
          const gym = getGym(ath.salleId);
          const compat = exercises.filter((ex) => isCompat(ex, gym));
          if (compat.length === 0) {
            toast("Aucune machine cochée pour cette salle.", true);
            return;
          }
          const picked = [];
          const seen = new Set();
          for (const ex of compat) {
            if (!seen.has(ex.groupe) && picked.length < 5) {
              picked.push(ex);
              seen.add(ex.groupe);
            }
          }
          for (const ex of compat) {
            if (picked.length < 5 && !picked.some((p) => p.id === ex.id)) picked.push(ex);
          }
          draft.titre = "Séance Sur-Mesure • " + gym.nom;
          draft.notes = "Programme 100 % compatible avec les machines de " + gym.nom + ".";
          draft.exercices = picked.map((ex) => ({
            exId: ex.id,
            series: ex.series || 3,
            reps: ex.reps || "10-12",
            charge: ex.charge || "Adaptée",
            repos: ex.repos || 90,
            faites: Array(ex.series || 3).fill(false)
          }));
          render();
          toast("Séance de " + picked.length + " exercices composée pour " + gym.nom + " !");
        } else if (action === "toggle-set") {
          const ath = athletes.find((a) => a.id === state.athleteId);
          const exIdx = Number(target.getAttribute("data-ex-idx"));
          const sIdx = Number(target.getAttribute("data-set-idx"));
          if (!ath || !ath.exercices[exIdx]) return;
          const item = ath.exercices[exIdx];
          if (!Array.isArray(item.faites)) item.faites = Array(item.series).fill(false);
          const next = !item.faites[sIdx];
          item.faites[sIdx] = next;
          saveAll("athletes", ath);
          render();
          if (next) {
            const ex = getEx(item.exId);
            startTimer(item.repos || 90, ex.nom + " • Série " + (sIdx + 1) + "/" + item.series);
          }
        } else if (action === "timer-adjust") {
          const delta = Number(target.getAttribute("data-delta")) || 0;
          timerLeft = Math.max(5, timerLeft + delta);
          if (timerLeft > timerTotal) timerTotal = timerLeft;
          paintTimer();
        } else if (action === "timer-stop") {
          stopTimer(false);
        } else if (action === "modal-athlete-detail") {
          const ath = athletes.find((a) => a.id === target.getAttribute("data-athlete-id"));
          if (!ath) return;
          const gym = getGym(ath.salleId);
          const logs = checkins.filter((c) => c.athleteId === ath.id);
          openModal(`
            <div class="stack">
              <div class="row-between" style="border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <div>
                  <span class="pill pill-orange">Fiche Athlète</span>
                  <h2 style="margin: 6px 0 2px; font-size: 19px; font-weight: 900;">${esc(ath.nom)}</h2>
                  <div style="font-size: 12px; color: #fcd34d;">${esc(ath.objectif)} • Code : <strong>${esc(ath.code)}</strong></div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" data-action="close-modal">✕</button>
              </div>
              <div class="grid-4">
                <div class="card-sub"><div style="font-size:11px;color:var(--text-muted);">Salle</div><strong>${esc(gym.nom)}</strong></div>
                <div class="card-sub"><div style="font-size:11px;color:var(--text-muted);">Poids</div><strong>${ath.poids} kg</strong></div>
                <div class="card-sub"><div style="font-size:11px;color:var(--text-muted);">Masse grasse</div><strong>${ath.masseGrasse}%</strong></div>
                <div class="card-sub"><div style="font-size:11px;color:var(--text-muted);">Progression</div><strong style="color:#6ee7b7;">${calcProgress(ath)}%</strong></div>
              </div>
              <div class="card-sub stack-sm">
                <div style="font-size: 11px; font-weight: 800; color: #fcd34d;">SÉANCE EN COURS : ${esc(ath.seanceTitre)}</div>
                ${ath.exercices.map((it, i) => `
                  <div class="row-between" style="font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 5px;">
                    <span><strong style="color:#fb923c;">#${i + 1}</strong> ${esc(getEx(it.exId).nom)}</span>
                    <span style="color:var(--text-muted);">${it.series}×${esc(it.reps)} • ${esc(it.charge)}</span>
                  </div>
                `).join("")}
              </div>
              <div class="stack-sm">
                <div style="font-size: 11px; font-weight: 800; color: var(--text-muted);">HISTORIQUE BIOMÉTRIQUE (${logs.length})</div>
                ${logs.slice(0, 3).map((l) => `
                  <div class="card-sub row-between" style="font-size: 12px;">
                    <span><strong>${esc(l.date)}</strong> : ${l.poids} kg • MG ${l.masseGrasse}%</span>
                    <span class="pill pill-green">Forme ${l.forme}/10</span>
                  </div>
                `).join("")}
              </div>
              <div class="row" style="justify-content: flex-end;">
                <button type="button" class="btn btn-primary" data-action="close-modal-and-builder" data-athlete-id="${ath.id}">Préparer sa prochaine séance</button>
              </div>
            </div>
          `);
        } else if (action === "close-modal-and-builder") {
          closeModal();
          const id = target.getAttribute("data-athlete-id");
          state.builderAthleteId = id;
          draft = makeDraft(id);
          state.coachTab = "builder";
          render();
        } else if (action === "modal-new-athlete") {
          openModal(`
            <form data-form="create-athlete" class="stack">
              <div class="row-between" style="border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <h2 style="margin: 0; font-size: 17px; font-weight: 900;">Ajouter un nouvel athlète</h2>
                <button type="button" class="btn btn-secondary btn-sm" data-action="close-modal">✕</button>
              </div>
              <div class="grid-2">
                <div><label class="label">Nom & Prénom</label><input id="na-nom" class="input" type="text" required placeholder="Ex : Thomas Garnier" /></div>
                <div><label class="label">Code d'accès</label><input id="na-code" class="input" type="text" required placeholder="Ex : THOMAS-2026" style="text-transform:uppercase;font-family:monospace;" /></div>
                <div><label class="label">Objectif</label><input id="na-obj" class="input" type="text" value="Hypertrophie & Force" required /></div>
                <div><label class="label">Salle attribuée</label>
                  <select id="na-salle" class="select">${gyms.map((g) => `<option value="${g.id}">${esc(g.nom)}</option>`).join("")}</select>
                </div>
                <div><label class="label">Poids (kg)</label><input id="na-poids" class="input" type="number" step="0.1" value="75.0" /></div>
                <div><label class="label">Calories cibles</label><input id="na-kcal" class="input" type="number" value="2500" /></div>
              </div>
              <div class="row" style="justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Créer l'athlète</button>
              </div>
            </form>
          `);
        } else if (action === "modal-new-exercise") {
          openModal(`
            <form data-form="create-exercise" class="stack">
              <div class="row-between" style="border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <h2 style="margin: 0; font-size: 17px; font-weight: 900;">Ajouter un exercice au catalogue</h2>
                <button type="button" class="btn btn-secondary btn-sm" data-action="close-modal">✕</button>
              </div>
              <div class="grid-2">
                <div style="grid-column: 1 / -1;"><label class="label">Nom de l'exercice</label><input id="ne-nom" class="input" type="text" required placeholder="Ex : Presse à cuisses unilatérale" /></div>
                <div><label class="label">Groupe musculaire</label>
                  <select id="ne-groupe" class="select">${["Pectoraux", "Dos", "Jambes", "Épaules", "Bras", "Abdos", "Cardio"].map((g) => `<option value="${g}">${g}</option>`).join("")}</select>
                </div>
                <div><label class="label">Machine requise</label>
                  <select id="ne-machine" class="select">${MACHINES_LIST.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}</select>
                </div>
                <div><label class="label">Séries par défaut</label><input id="ne-series" class="input" type="number" min="1" max="10" value="4" /></div>
                <div><label class="label">Répétitions</label><input id="ne-reps" class="input" type="text" value="10-12" /></div>
                <div style="grid-column: 1 / -1;"><label class="label">Réglage machine</label><input id="ne-reglage" class="input" type="text" placeholder="Position du siège, hauteur des appuis..." /></div>
                <div style="grid-column: 1 / -1;"><label class="label">Consignes d'exécution</label><input id="ne-consignes" class="input" type="text" placeholder="Tempo, trajectoire, respiration..." /></div>
              </div>
              <div class="row" style="justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer l'exercice</button>
              </div>
            </form>
          `);
        } else if (action === "modal-new-gym") {
          openModal(`
            <form data-form="create-gym" class="stack">
              <div class="row-between" style="border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <h2 style="margin: 0; font-size: 17px; font-weight: 900;">Ajouter une salle de sport</h2>
                <button type="button" class="btn btn-secondary btn-sm" data-action="close-modal">✕</button>
              </div>
              <div class="grid-2">
                <div><label class="label">Nom de la salle</label><input id="ng-nom" class="input" type="text" required placeholder="Ex : Pornichet - Fitness" /></div>
                <div><label class="label">Ville</label><input id="ng-ville" class="input" type="text" required placeholder="Ex : Pornichet" /></div>
              </div>
              <div>
                <div class="label" style="color: #fcd34d;">Machines disponibles dans cette salle :</div>
                <div class="grid-2">
                  ${MACHINES_LIST.map((m, i) => `
                    <label class="card-sub row" style="cursor: pointer; font-size: 12px;">
                      <input type="checkbox" name="ng-mac" value="${esc(m)}" ${i < 6 ? "checked" : ""} />
                      <span>${esc(m)}</span>
                    </label>
                  `).join("")}
                </div>
              </div>
              <div class="row" style="justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Créer la salle</button>
              </div>
            </form>
          `);
        } else if (action === "modal-ex-guide") {
          const ex = getEx(target.getAttribute("data-ex-id"));
          openModal(`
            <div class="stack">
              <div class="row-between" style="border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <div>
                  <span class="pill pill-orange">${esc(ex.groupe)}</span>
                  <h2 style="margin: 6px 0 2px; font-size: 18px; font-weight: 900;">${esc(ex.nom)}</h2>
                  <div style="font-size: 12px; color: #fcd34d;">Machine : <strong>${esc(ex.machine)}</strong></div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" data-action="close-modal">✕</button>
              </div>
              <div class="card-sub">
                <div class="label" style="color: #fb923c;">1. Réglage machine & installation</div>
                <div style="font-size: 13px;">${esc(ex.reglage)}</div>
              </div>
              <div class="card-sub">
                <div class="label" style="color: #6ee7b7;">2. Exécution & consignes</div>
                <div style="font-size: 13px;">${esc(ex.consignes)}</div>
              </div>
              <div class="row-between">
                <a href="${esc(ex.video)}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost-orange">▶ Voir la vidéo de démonstration</a>
                <button type="button" class="btn btn-secondary" data-action="close-modal">Fermer</button>
              </div>
            </div>
          `);
        }
      });

      document.body.addEventListener("input", function (e) {
        const el = e.target;
        const inp = el.getAttribute("data-input");
        if (!inp) return;

        if (inp === "athlete-search") {
          state.athleteSearch = el.value;
          render();
        } else if (inp === "builder-search") {
          state.builderSearch = el.value;
          render();
        } else if (inp === "catalog-search") {
          state.catalogSearch = el.value;
          render();
        } else if (inp === "draft-titre") {
          draft.titre = el.value;
        } else if (inp === "draft-jour") {
          draft.jour = el.value;
        } else if (inp === "draft-notes") {
          draft.notes = el.value;
        } else if (inp === "draft-ex-field") {
          const idx = Number(el.getAttribute("data-idx"));
          const field = el.getAttribute("data-field");
          const item = draft.exercices[idx];
          if (!item) return;
          if (field === "series" || field === "repos") {
            const n = Math.max(1, parseInt(el.value, 10) || 1);
            item[field] = n;
            if (field === "series") item.faites = Array(n).fill(false);
          } else {
            item[field] = el.value;
          }
        }
      });

      document.body.addEventListener("change", function (e) {
        const el = e.target;
        const ch = el.getAttribute("data-change");
        if (!ch) return;

        if (ch === "athlete-gym-filter") {
          state.athleteGymFilter = el.value;
          render();
        } else if (ch === "assign-athlete-gym") {
          const ath = athletes.find((a) => a.id === el.getAttribute("data-athlete-id"));
          if (!ath) return;
          ath.salleId = el.value;
          saveAll("athletes", ath);
          render();
          toast(ath.nom + " rattaché(e) à " + getGym(el.value).nom + ".");
        } else if (ch === "builder-athlete") {
          state.builderAthleteId = el.value;
          draft = makeDraft(el.value);
          render();
        } else if (ch === "builder-only-compat") {
          state.builderOnlyCompat = el.checked;
          render();
        } else if (ch === "catalog-gym-compat") {
          state.catalogGymCompatId = el.value;
          render();
        } else if (ch === "toggle-gym-machine") {
          const gym = gyms.find((g) => g.id === el.getAttribute("data-gym-id"));
          const mac = el.getAttribute("data-machine");
          if (!gym) return;
          const idx = gym.machines.indexOf(mac);
          if (idx >= 0) gym.machines.splice(idx, 1);
          else gym.machines.push(mac);
          saveAll("gyms", gym);
          render();
          toast("Équipements mis à jour pour " + gym.nom + ".");
        } else if (ch === "tracking-athlete") {
          state.trackingAthleteId = el.value;
          render();
        } else if (ch === "ath-load") {
          const ath = athletes.find((a) => a.id === state.athleteId);
          const idx = Number(el.getAttribute("data-ex-idx"));
          if (ath && ath.exercices[idx]) {
            ath.exercices[idx].charge = el.value;
            saveAll("athletes", ath);
            toast("Charge mise à jour.");
          }
        }
      });

      document.body.addEventListener("submit", function (e) {
        const form = e.target.closest("[data-form]");
        if (!form) return;
        e.preventDefault();
        const type = form.getAttribute("data-form");

        if (type === "login-athlete") {
          guaranteeDefaults();
          const code = (document.getElementById("inp-ath-code").value || "").trim().toUpperCase();
          const found = athletes.find((a) => a.code.toUpperCase() === code);
          if (!found) {
            state.loginError = "Code introuvable. Essaie LUCAS-2026, CHLOE-2026 ou MAX-2026.";
            render();
            return;
          }
          state.loginError = "";
          state.role = "athlete";
          state.athleteId = found.id;
          state.athleteTab = "workout";
          render();
          toast("Bienvenue " + found.nom + " !");
        } else if (type === "login-coach") {
          guaranteeDefaults();
          const email = (document.getElementById("inp-coach-email").value || "").trim().toLowerCase();
          const pass = (document.getElementById("inp-coach-pass").value || "").trim();
          if (email === "coach@btraining.fr" && pass === "admin") {
            state.loginError = "";
            state.role = "coach";
            state.coachTab = "athletes";
            render();
            toast("Espace Coach ouvert !");
          } else {
            state.loginError = "Identifiants incorrects (coach@btraining.fr / admin).";
            render();
          }
        } else if (type === "publish-workout") {
          const ath = athletes.find((a) => a.id === draft.athleteId);
          if (!ath) return;
          ath.seanceTitre = draft.titre.trim() || "Séance personnalisée";
          ath.seanceJour = draft.jour.trim() || "Prochaine séance";
          ath.seanceNotes = draft.notes.trim();
          ath.exercices = JSON.parse(JSON.stringify(draft.exercices));
          saveAll("athletes", ath);
          render();
          toast("Séance enregistrée et publiée pour " + ath.nom + " !");
        } else if (type === "create-athlete") {
          const nom = document.getElementById("na-nom").value.trim();
          const code = document.getElementById("na-code").value.trim().toUpperCase();
          const objectif = document.getElementById("na-obj").value.trim();
          const salleId = document.getElementById("na-salle").value;
          const poids = parseFloat(document.getElementById("na-poids").value) || 75;
          const calories = parseInt(document.getElementById("na-kcal").value, 10) || 2500;
          if (!nom || !code) return;
          const ath = {
            id: "ath-" + Date.now(),
            nom,
            code,
            objectif,
            salleId,
            poids,
            masseGrasse: 15,
            calories,
            proteines: 160,
            seanceTitre: "Séance Découverte",
            seanceJour: "À planifier",
            seanceNotes: "Bienvenue sur B training !",
            exercices: []
          };
          athletes.push(ath);
          saveAll("athletes", ath);
          closeModal();
          render();
          toast("Athlète " + nom + " ajouté !");
        } else if (type === "create-exercise") {
          const nom = document.getElementById("ne-nom").value.trim();
          const groupe = document.getElementById("ne-groupe").value;
          const machine = document.getElementById("ne-machine").value;
          const series = parseInt(document.getElementById("ne-series").value, 10) || 4;
          const reps = document.getElementById("ne-reps").value.trim() || "10-12";
          const reglage = document.getElementById("ne-reglage").value.trim() || "Réglage standard.";
          const consignes = document.getElementById("ne-consignes").value.trim() || "Exécution contrôlée.";
          if (!nom) return;
          const ex = {
            id: "ex-" + Date.now(),
            nom,
            groupe,
            machine,
            series,
            reps,
            charge: "Adaptée",
            repos: 90,
            reglage,
            consignes,
            video: "https://www.youtube.com/results?search_query=" + encodeURIComponent(nom + " musculation")
          };
          exercises.unshift(ex);
          saveAll("exercises", ex);
          closeModal();
          render();
          toast("Exercice « " + nom + " » ajouté au catalogue !");
        } else if (type === "create-gym") {
          const nom = document.getElementById("ng-nom").value.trim();
          const ville = document.getElementById("ng-ville").value.trim();
          const machines = Array.from(form.querySelectorAll('input[name="ng-mac"]:checked')).map((c) => c.value);
          if (!nom) return;
          const gym = { id: "gym-" + Date.now(), nom, ville, machines };
          gyms.push(gym);
          state.selectedGymId = gym.id;
          saveAll("gyms", gym);
          closeModal();
          render();
          toast("Salle « " + nom + " » créée !");
        } else if (type === "athlete-checkin") {
          const ath = athletes.find((a) => a.id === state.athleteId);
          if (!ath) return;
          const notes = document.getElementById("f-chk-notes").value.trim();
          const chk = {
            id: "chk-" + Date.now(),
            athleteId: ath.id,
            athleteName: ath.nom,
            date: new Date().toISOString().slice(0, 10),
            poids,
            masseGrasse,
            calories,
            proteines,
            forme,
            notes
          };
          ath.poids = poids;
          ath.masseGrasse = masseGrasse;
          ath.calories = calories;
          ath.proteines = proteines;
          checkins.unshift(chk);
          saveAll("athletes", ath);
          saveAll("checkins", chk);
          render();
          toast("Bilan transmis au coach !");
        }
      });

      // Pont pour synchronisation Firestore non bloquante
      window.__BT_BRIDGE__ = {
        getData: () => ({ gyms, exercises, athletes, checkins }),
        applyRemote: (col, arr) => {
          if (!Array.isArray(arr) || arr.length === 0) return;
          if (col === "gyms") { gyms = arr; writeStore(KEYS.GYMS, JSON.stringify(gyms)); }
          if (col === "exercises") { exercises = arr; writeStore(KEYS.EXERCISES, JSON.stringify(exercises)); }
          if (col === "athletes") { athletes = arr; guaranteeDefaults(); writeStore(KEYS.ATHLETES, JSON.stringify(athletes)); }
          if (col === "checkins") { checkins = arr.map(normalizeCheckin).filter(Boolean); writeStore(KEYS.CHECKINS, JSON.stringify(checkins)); }
          render();
        },
        setLive: (live) => {
          state.firestoreLive = Boolean(live);
          render();
        }
      };

      // RENDU SYNCHRONE IMMÉDIAT
      render();
    })();
  </script>

  <!-- SYNCHRONISATION FIREBASE FIRESTORE EN ARRIÈRE-PLAN (NON BLOQUANTE) -->
  <script type="module">
    setTimeout(async () => {
      try {
        const [{ initializeApp }, { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, onSnapshot }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
        ]);

        const app = initializeApp(window.BTRAINING_FIREBASE_CONFIG);
        const db = getFirestore(app);

        window.btFirebaseSave = async (col, id, data) => {
          try { await setDoc(doc(db, col, id), data, { merge: true }); } catch (e) {}
        };

        window.btFirebaseDelete = async (col, id) => {
          try { await deleteDoc(doc(db, col, id)); } catch (e) {}
        };

        const init = window.__BT_BRIDGE__.getData();
        const seed = async (col, list) => {
          const snap = await getDocs(collection(db, col));
          if (snap.empty) {
            for (const item of list) await setDoc(doc(db, col, item.id), item);
          }
        };

        await Promise.all([
          seed("gyms", init.gyms),
          seed("exercises", init.exercises),
          seed("athletes", init.athletes),
          seed("checkins", init.checkins)
        ]);

        ["gyms", "exercises", "athletes", "checkins"].forEach((col) => {
          onSnapshot(collection(db, col), (snap) => {
            if (!snap.empty) window.__BT_BRIDGE__.applyRemote(col, snap.docs.map((d) => d.data()));
          });
        });

        window.__BT_BRIDGE__.setLive(true);
      } catch (e) {
        window.__BT_BRIDGE__.setLive(false);
      }
    }, 300);
  </script>
