        return Array.isArray(parsed) && parsed.length > 0 ? parsed : JSON.parse(JSON.stringify(fallbackArray));

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getExerciseById(exId) {
      return exercisesCatalog.find((e) => e.id === exId) || {

      };

    function isExerciseCompatible(ex, gym) {
      if (!ex || !gym || !Array.isArray(gym.machines)) return false;
      return gym.machines.includes(ex.machine);
    }

    function getWorkoutProgress(ath) {
      if (!ath || !Array.isArray(ath.exercices) || ath.exercices.length === 0) return 0;
      let total = 0;
      let done = 0;
      for (const item of ath.exercices) {
        const count = Number(item.series) || 0;
        total += count;
        for (let i = 0; i < count; i++) {
          if (item.faites && item.faites[i]) done++;
        }
      }
      return total === 0 ? 0 : Math.round((done / total) * 100);
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const el = document.createElement("div");
      const styles =
        type === "warning"
          ? "border-amber-500/50 bg-zinc-900/95 text-amber-200"
          : type === "error"
          ? "border-rose-500/50 bg-zinc-900/95 text-rose-200"
          : "border-orange-500/50 bg-zinc-900/95 text-zinc-100";

      el.className = `pointer-events-auto rounded-2xl border ${styles} px-4 py-3 shadow-2xl text-xs sm:text-sm font-semibold flex items-center justify-between gap-3 transition-all`;
      el.innerHTML = `<span>${esc(message)}</span><button type="button" onclick="this.parentElement.remove()" class="text-zinc-400 hover:text-white font-bold">✕</button>`;
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentElement) el.remove();
      }, 3600);
    }

    window.composeCompatibleWorkout = function() {
      const ath = athletes.find((a) => a.id === builderDraft.athleteId);
      if (!ath) return;
      const gym = getGym(ath.salleId);
      const compatibles = exercisesCatalog.filter((ex) => isExerciseCompatible(ex, gym));

      if (compatibles.length === 0) {
        showToast("Aucune machine cochée dans cette salle ! Configure d'abord la salle.", "warning");
        return;
      }

      const picked = [];
      const usedGroups = new Set();
      for (const ex of compatibles) {
        if (!usedGroups.has(ex.groupe) && picked.length < 5) {
          picked.push(ex);
          usedGroups.add(ex.groupe);
        }
      }
      for (const ex of compatibles) {
        if (picked.length < 5 && !picked.some((p) => p.id === ex.id)) {
          picked.push(ex);
        }
      }

      builderDraft.title = `Séance Sur-Mesure • ${gym.nom}`;
      builderDraft.notes = `Programme 100 % compatible avec les machines de ${gym.nom}.`;
      builderDraft.exercises = picked.map((ex) => ({
        exId: ex.id,
        series: ex.setsDefault || 3,
        reps: ex.repsDefault || "10-12",
        charge: ex.loadDefault || "Adaptée",
        reposSec: ex.restSec || 90,
        faites: Array(ex.setsDefault || 3).fill(false)
      }));

      render();
      showToast(`Séance de ${picked.length} exercices générée pour ${gym.nom} !`);
    };

    let restInterval = null;

    function playTimerBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const r = String(s % 60).padStart(2, "0");
      return `${m}:${r}`;
    }

    function updateRestTimerUI() {
      const countdownEl = document.getElementById("timer-countdown");
      const barEl = document.getElementById("timer-progress-bar");
      if (countdownEl) countdownEl.textContent = formatSeconds(restRemaining);
      if (barEl) {
        const pct = restTotal > 0 ? Math.max(0, Math.min(100, (restRemaining / restTotal) * 100)) : 0;
        barEl.style.width = `${pct}%`;
      }
    }

    window.startRestTimer = function(seconds, contextText) {
      stopRestTimer(true);
      restTotal = Math.max(10, Number(seconds) || 90);
      restRemaining = restTotal;

      const widget = document.getElementById("rest-timer-widget");
      const ctxEl = document.getElementById("timer-context");
      if (ctxEl) ctxEl.textContent = contextText || "Série validée • Récupération";
      if (widget) widget.classList.remove("hidden");
      updateRestTimerUI();

      restInterval = setInterval(() => {
        restRemaining -= 1;
        updateRestTimerUI();
        if (restRemaining <= 0) {
          stopRestTimer();
          playTimerBeep();
          showToast("Repos terminé ! C'est parti pour la série suivante.");
        }
      }, 1000);
    };

    window.adjustRestTimer = function(delta) {
      restRemaining = Math.max(5, restRemaining + delta);
      if (restRemaining > restTotal) restTotal = restRemaining;
      updateRestTimerUI();
    };

    window.stopRestTimer = function(silent = false) {
      if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
      }
      const widget = document.getElementById("rest-timer-widget");
      if (widget && !silent) widget.classList.add("hidden");
    };

    window.toggleAthleteSet = function(athleteId, exIndex, setIndex) {
      const ath = athletes.find((a) => a.id === athleteId);
      if (!ath || !ath.exercices[exIndex]) return;
      const item = ath.exercices[exIndex];
      if (!Array.isArray(item.faites)) item.faites = Array(item.series).fill(false);

      const nextVal = !item.faites[setIndex];
      item.faites[setIndex] = nextVal;
      persistAllData("athletes", ath);
      render();

      if (nextVal) {
        const ex = getExerciseById(item.exId);
        startRestTimer(item.reposSec || 90, `${ex.nom} • Série ${setIndex + 1}/${item.series}`);
      }
    };

    window.updateAthleteSetLoad = function(athleteId, exIndex, newLoad) {
      const ath = athletes.find((a) => a.id === athleteId);
      if (!ath || !ath.exercices[exIndex]) return;
      ath.exercices[exIndex].charge = newLoad;
      persistAllData("athletes", ath);
      showToast("Charge mise à jour et synchronisée.");

      if (existingId) {
        const idx = exercisesCatalog.findIndex((x) => x.id === existingId);
        if (idx >= 0) {
          exercisesCatalog[idx] = {
            ...exercisesCatalog[idx],
            nom,
            groupe,
            machine,
            setsDefault,
            repsDefault,
            reglage,
            execution
          };
          persistAllData("exercises", exercisesCatalog[idx]);
          showToast(`Exercice « ${nom} » mis à jour.`);

        const created = {

          nom,
          groupe,

          loadDefault: "Charge adaptée",

    function renderCoachAthletesTab() {
      const q = state.athleteSearch.trim().toLowerCase();
      const filtered = athletes.filter((a) => {
        const gym = getGym(a.salleId);
        const matchText =
          !q ||
          a.nom.toLowerCase().includes(q) ||
          a.code.toLowerCase().includes(q) ||
          a.objectif.toLowerCase().includes(q) ||
          gym.nom.toLowerCase().includes(q);
        const matchGym = state.athleteGymFilter === "all" || a.salleId === state.athleteGymFilter;
        return matchText && matchGym;
      });

      return `
        <section class="space-y-5">
          <div class="glass-card rounded-2xl p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div class="flex-1 flex flex-col sm:flex-row gap-3">

              return `

                      <div class="flex items-center gap-3 min-w-0">

                          ${esc(initials)}
                        </div>
                        <div class="min-w-0">
                          <h2 class="font-extrabold text-white text-base truncate">${esc(ath.nom)}</h2>
                          <p class="text-xs font-semibold text-amber-300 truncate">${esc(ath.objectif)}</p>
                        </div>
                      </div>
                      <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/35 shrink-0">${esc(ath.statut)}</span>
                    </div>

                    <div onclick="event.stopPropagation()" class="p-3 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-1.5">
                      <div class="flex items-center justify-between text-[11px]">
                        <span class="text-zinc-400 font-semibold">Salle attribuée</span>
                        <span class="text-amber-300 font-bold">${gym.machines?.length || 0} machines</span>
                      </div>
                      <select onchange="assignAthleteGym('${ath.id}', this.value)" class="w-full px-2.5 py-1.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-bold text-white">

                      </select>
                    </div>

                    <div class="flex items-center justify-between px-3.5 py-2 rounded-xl bg-zinc-950 border border-zinc-800">
                      <span class="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">Code accès</span>

                  </div>
                </article>
              `;
            }).join("")}
          </div>
        </section>
      `;

    function renderCoachBuilderTab() {
      const ath = athletes.find((a) => a.id === builderDraft.athleteId) || athletes[0];
      if (!ath) return "";
      const gym = getGym(ath.salleId);

      const groups = ["Tous", "Pectoraux", "Dos", "Jambes", "Épaules", "Bras", "Abdos", "Cardio"];
      const search = state.builderSearch.trim().toLowerCase();

      const filteredCatalog = exercisesCatalog.filter((ex) => {
        const okMuscle = state.builderMuscleFilter === "Tous" || ex.groupe === state.builderMuscleFilter;
        const okText = !search || ex.nom.toLowerCase().includes(search) || ex.machine.toLowerCase().includes(search);
        const okGym = !state.builderCompatibleOnly || isExerciseCompatible(ex, gym);
        return okMuscle && okText && okGym;

      return `

                <label class="block text-xs font-bold uppercase tracking-wider text-orange-400 mb-1.5">Athlète sélectionné</label>

                  ${gyms.map((g) => `<option value="${g.id}" ${g.id === gym.id ? "selected" : ""}>${esc(g.nom)}</option>`).join("")}

            <div class="p-3.5 rounded-2xl bg-zinc-950 border border-zinc-800">

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Titre de la séance</label>
                <input type="text" value="${esc(builderDraft.title)}" oninput="setBuilderField('title', this.value)" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm font-bold text-white" />

              </div>
            </div>

                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${

            <div class="flex flex-wrap gap-1.5">

                  <div class="space-y-2">
                    <div class="flex items-center justify-between gap-2">

                      <span class="text-[11px] font-semibold text-emerald-300">${eqGyms}/${gyms.length} salles</span>

                    <h3 class="text-base font-extrabold text-white">${esc(ex.nom)}</h3>

                  <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="openExerciseGuideModal('${ex.id}')" class="py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-white border border-zinc-700">Guide & Vidéo</button>
                    <button type="button" onclick="openExerciseEditorModal('${ex.id}')" class="py-2 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-xs font-extrabold text-amber-300 border border-amber-500/35">Modifier</button>
                  </div>
                </article>

        (c) => state.trackingFilterAthleteId === "all" || c.athleteId === state.trackingFilterAthleteId

        <section class="space-y-5">
          <div class="glass-card rounded-3xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-zinc-800">

              <h2 class="text-lg font-black text-white">Suivi Biométrique & Check-ins (${filtered.length})</h2>

    function renderAthleteDashboard() {
      const ath = athletes.find((a) => a.id === state.athleteId) || athletes[0];
      if (!ath) return "";
      const gym = getGym(ath.salleId);
      const pct = getWorkoutProgress(ath);

      return `
        <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-5 pb-28 space-y-6">
          <div class="glass-card rounded-3xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-zinc-800">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="font-extrabold uppercase tracking-wider text-amber-400">${esc(ath.objectif)}</span>
                <span class="px-2.5 py-0.5 rounded-full bg-orange-500/15 text-orange-300 border border-orange-500/35 font-bold">Salle : ${esc(gym.nom)}</span>
              </div>
              <h1 class="text-xl sm:text-2xl font-black text-white">Bonjour ${esc(ath.nom.split(" ")[0])}</h1>
              <p class="text-xs text-zinc-400">Objectif nutritionnel : <strong class="text-zinc-200">${ath.caloriesCibles} kcal</strong> • <strong class="text-orange-300">${ath.proteinesCibles}g protéines</strong></p>

            <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-zinc-950 border border-zinc-800 shrink-0">

              <button type="button" onclick="setAthleteTab('tracking')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold transition ${
                state.athleteTab === "tracking" ? "btn-gradient" : "text-zinc-300"
              }">
                Mon Suivi
              </button>
            </div>
          </div>

          ${state.athleteTab === "workout" ? renderAthleteWorkout(ath, gym, pct) : renderAthleteTracking(ath)}
        </main>
      `;
    }

    function renderAthleteWorkout(ath, gym, pct) {
      const list = ath.exercices || [];
      return `
        <section class="space-y-5">
          <div class="glass-card rounded-3xl p-5 space-y-3 border border-orange-500/30">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="px-2.5 py-1 rounded-lg bg-orange-500/15 text-orange-300 text-[11px] font-bold">${esc(ath.seanceJour || "Séance du jour")}</span>
                <h2 class="text-lg sm:text-xl font-black text-white mt-2">${esc(ath.seanceTitre)}</h2>
              </div>
              <span class="text-sm font-black text-orange-400">${pct}% validé</span>
            </div>
            ${ath.seanceNotes ? `<p class="text-xs text-zinc-300">Consignes du coach : ${esc(ath.seanceNotes)}</p>` : ""}
            <div class="h-2 w-full bg-zinc-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all duration-300" style="width: ${pct}%;"></div>
            </div>
          </div>

          ${list.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center text-xs text-zinc-400 border border-zinc-800">

            </div>
          ` : `
            <div class="space-y-4">
              ${list.map((item, exIdx) => {
                const ex = getExerciseById(item.exId);
                const count = Number(item.series) || 3;
                const checks = Array.from({ length: count }, (_, i) => Boolean(item.faites?.[i]));

                return `
                  <article class="glass-card rounded-3xl p-4 sm:p-5 space-y-4 border border-zinc-800">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <h3 class="text-base sm:text-lg font-extrabold text-white">${esc(ex.nom)}</h3>
                        <p class="text-xs text-zinc-400 mt-0.5">
                          Machine : <strong class="text-zinc-200">${esc(ex.machine)}</strong> • <strong class="text-orange-300">${count} × ${esc(item.reps)}</strong> • Repos : <strong class="text-amber-300">${item.reposSec}s</strong>
                        </p>
                      </div>
                      <div class="flex items-center gap-2">
                        <input type="text" value="${esc(item.charge)}" onchange="updateAthleteSetLoad('${ath.id}', ${exIdx}, this.value)" aria-label="Charge utilisée" class="w-28 px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-xs font-bold text-orange-300" />
                        <button type="button" onclick="openExerciseGuideModal('${ex.id}')" class="px-3.5 py-2 rounded-xl bg-orange-500/15 hover:bg-orange-500/25 border border-orange-500/40 text-xs font-extrabold text-orange-300 shrink-0">
                          Guide & Vidéo
                        </button>
                      </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

                          done ? "bg-orange-500/15 border-orange-500/50" : "bg-zinc-950 border-zinc-800 hover:border-zinc-700"
                        }">
                          <input type="checkbox" ${done ? "checked" : ""} onchange="toggleAthleteSet('${ath.id}', ${exIdx}, ${sIdx})" class="set-checkbox h-5 w-5 rounded-md border-zinc-600 bg-zinc-900 cursor-pointer" />
                          <div class="min-w-0">
                            <span class="text-xs font-extrabold block ${done ? "text-orange-300" : "text-zinc-200"}">Série ${sIdx + 1}</span>
                            <span class="text-[11px] text-zinc-400 truncate block">${esc(item.reps)} reps</span>
                          </div>
                        </label>
                      `).join("")}
                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          `}
        </section>
      `;
    }

    function renderAthleteTracking(ath) {
      const myCheckins = checkins.filter((c) => c.athleteId === ath.id);
      return `
        <section class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <form onsubmit="submitAthleteCheckin(event, '${ath.id}')" class="lg:col-span-6 glass-card rounded-3xl p-5 space-y-4 border border-zinc-800">
            <h2 class="text-base font-extrabold text-white">Envoyer mon bilan au coach</h2>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Poids (kg)</label>
                <input id="chk-poids" type="number" step="0.1" value="${ath.poidsActuel}" required class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-sm font-bold text-white" />
              </div>
              <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Tour de taille (cm)</label>

                <input id="chk-energie" type="number" min="1" max="10" value="8" class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-sm font-bold text-amber-300" />
              </div>
              <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Respect nutritionnel (%)</label>
                <input id="chk-nutri" type="number" min="0" max="100" value="90" class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-sm font-bold text-emerald-300" />
              </div>
            </div>

            <div>
              <label class="block text-[11px] text-zinc-400 mb-1">Commentaire / Sensations</label>
              <input id="chk-comment" type="text" placeholder="Forme du jour, sensations sur les exercices..." class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white" />
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl btn-gradient font-black text-sm shadow-lg shadow-orange-500/20">

          <div class="lg:col-span-6 glass-card rounded-3xl p-5 space-y-3 border border-zinc-800">
            <h3 class="text-sm font-extrabold text-white">Historique personnel (${myCheckins.length})</h3>
            ${myCheckins.map((c) => `
              <div class="p-3.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-xs space-y-1">
                <div class="flex justify-between items-center">
                  <strong class="text-white">${esc(c.date)} • <span class="text-orange-300">${c.poids} kg</span></strong>
                  <span class="px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-300 font-bold">Énergie ${c.energie}/10 • Nutri ${c.nutritionPct}%</span>
                </div>
                <p class="text-zinc-400">${esc(c.commentaire)}</p>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (!root) return;

      let screen = "";
      if (!state.role) {
        screen = renderLoginScreen();
      } else if (state.role === "coach") {
        screen = renderCoachDashboard();
      } else {
        screen = renderAthleteDashboard();
      }

      root.innerHTML = renderHeader() + screen;
    }

    // Exposition propre pour la synchronisation Firestore non bloquante
    window.__BTRAINING__ = {
      state,
      render,
      ensureDefaultAccountsPresent,
      getData: () => ({ gyms, exercisesCatalog, athletes, checkins }),
      setGyms: (arr) => {
        if (Array.isArray(arr) && arr.length > 0) {
          gyms = arr;
          safeSetStorage(STORAGE_KEYS.GYMS, JSON.stringify(gyms));
          render();
        }
      },
      setExercises: (arr) => {
        if (Array.isArray(arr) && arr.length > 0) {
          exercisesCatalog = arr;
          safeSetStorage(STORAGE_KEYS.EXERCISES, JSON.stringify(exercisesCatalog));
          render();
        }
      },
      setAthletes: (arr) => {
        if (Array.isArray(arr) && arr.length > 0) {
          athletes = arr;
          ensureDefaultAccountsPresent();
          safeSetStorage(STORAGE_KEYS.ATHLETES, JSON.stringify(athletes));
          render();
        }
      },
      setCheckins: (arr) => {
        if (Array.isArray(arr) && arr.length > 0) {
          checkins = arr;
          safeSetStorage(STORAGE_KEYS.CHECKINS, JSON.stringify(checkins));
          render();
        }
      }
    };

    // RENDU IMMÉDIAT GARANTI
    render();
  </script>

  <!-- SYNCHRONISATION FIREBASE FIRESTORE NON BLOQUANTE EN ARRIÈRE-PLAN -->
  <script type="module">
    async function initFirestoreInBackground() {
      try {
        const [{ initializeApp }, { getFirestore, collection, doc, setDoc, getDocs, onSnapshot }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
        ]);

        const app = initializeApp(window.BTRAINING_FIREBASE_CONFIG);
        const db = getFirestore(app);

        window.firebaseSync = {
          save: async function(collectionName, docId, payload) {
            try {
              await setDoc(doc(db, collectionName, docId), payload, { merge: true });
            } catch (err) {}
          }
        };

        const initial = window.__BTRAINING__.getData();
        const seedIfEmpty = async (colName, items) => {
          const snap = await getDocs(collection(db, colName));
          if (snap.empty) {
            for (const item of items) {
              await setDoc(doc(db, colName, item.id), item);
            }
          }
        };

        await Promise.all([
          seedIfEmpty("gyms", initial.gyms),
          seedIfEmpty("exercises", initial.exercisesCatalog),
          seedIfEmpty("athletes", initial.athletes),
          seedIfEmpty("checkins", initial.checkins)
        ]);

        onSnapshot(collection(db, "gyms"), (snap) => {
          if (!snap.empty) window.__BTRAINING__.setGyms(snap.docs.map((d) => d.data()));
        });
        onSnapshot(collection(db, "exercises"), (snap) => {
          if (!snap.empty) window.__BTRAINING__.setExercises(snap.docs.map((d) => d.data()));
        });
        onSnapshot(collection(db, "athletes"), (snap) => {
          if (!snap.empty) window.__BTRAINING__.setAthletes(snap.docs.map((d) => d.data()));
        });
        onSnapshot(collection(db, "checkins"), (snap) => {
          if (!snap.empty) window.__BTRAINING__.setCheckins(snap.docs.map((d) => d.data()));
        });

        window.__BTRAINING__.state.firestoreLive = true;
        window.__BTRAINING__.render();
      } catch (e) {
        // Repli propre sur le mode local déjà rendu
        window.__BTRAINING__.state.firestoreLive = false;
      }
    }

    initFirestoreInBackground();
  </script>
