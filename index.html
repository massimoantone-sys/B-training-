          ],

    // -------------------------------------------------------------------------
    // 2. APPLICATION STATE & FIRESTORE REAL-TIME SYNC WITH LOCAL FALLBACK
    // -------------------------------------------------------------------------
    let appState = loadLocalState();
    let db = null;
    let firestoreConnected = false;
    let unsubscribeSnapshot = null;

    let session = {
      role: null, // 'coach' | 'athlete' | null
      athleteId: null,
      coachActiveTab: "athletes", // 'athletes' | 'workouts' | 'tracking'
      selectedCoachAthleteId: "ath_lucas",
      athleteActiveTab: "workout" // 'workout' | 'tracking'
    };

    // Rest Timer State
    let timerInterval = null;
    let timerRemaining = 0;
    let timerTotal = 90;

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.athletes) && parsed.athletes.length > 0) {
            return parsed;
          }
        }
      } catch (err) {
        console.warn("LocalStorage lecture impossible :", err);
      }
      return structuredClone(DEFAULT_STATE);
    }

    function saveLocalState(nextState) {
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(nextState));
      } catch (err) {
        console.warn("LocalStorage écriture impossible :", err);
      }
    }

    async function persistState(nextState) {
      appState = nextState;
      saveLocalState(nextState);
      render();

      if (db) {
        try {
          const docRef = doc(db, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);
          await setDoc(docRef, {
            athletes: nextState.athletes,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          if (!firestoreConnected) {
            firestoreConnected = true;
            updateConnectionBadge();
          }
        } catch (err) {
          console.warn("Écriture Firestore en attente / indisponible, repli local actif :", err.message);
        }
      }
    }

    function initFirebaseSync() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        const docRef = doc(db, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);

        // Seed initial document if collection/doc doesn't exist yet
        getDoc(docRef).then((snap) => {
          if (!snap.exists()) {
            setDoc(docRef, {
              athletes: appState.athletes,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString()
            }).catch((err) => console.warn("Initialisation document Firestore :", err.message));
          }
        }).catch((err) => console.warn("Lecture initiale Firestore :", err.message));

        // Real-time listener
        unsubscribeSnapshot = onSnapshot(
          docRef,
          (snapshot) => {
            firestoreConnected = true;
            updateConnectionBadge();
            if (snapshot.exists()) {
              const data = snapshot.data();
              if (Array.isArray(data.athletes) && data.athletes.length > 0) {
                appState = { ...appState, athletes: data.athletes };
                saveLocalState(appState);
                render();
              }
            }
          },
          (error) => {
            console.warn("Firestore snapshot fallback (Mode Local) :", error.message);
            firestoreConnected = false;
            updateConnectionBadge();
          }
        );
      } catch (err) {
        console.warn("Firebase init error, Mode Local actif :", err.message);
        firestoreConnected = false;
        updateConnectionBadge();
      }
    }

    function updateConnectionBadge() {
      const badge = document.getElementById("connection-status-badge");
      if (!badge) return;
      if (firestoreConnected) {
        badge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-400/30";
        badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse-soft"></span>Firestore connecté • Temps réel actif`;
      } else {
        badge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/15 text-amber-300 border border-amber-400/30";
        badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-amber-400"></span>Mode Local`;
      }
    }

    // -------------------------------------------------------------------------
    // 3. AUDIO & FLOATING REST TIMER ENGINE
    // -------------------------------------------------------------------------
    function playTimerBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (_) {
        // Ignore audio autoplay blocks on restricted browsers
      }
    }

    function formatSeconds(sec) {
      const safe = Math.max(0, Math.floor(sec));
      const m = Math.floor(safe / 60).toString().padStart(2, "0");
      const s = (safe % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    window.startRestTimer = function(seconds, labelText = "Série validée • Récupération") {
      const duration = Number(seconds) > 0 ? Number(seconds) : 90;
      timerTotal = duration;
      timerRemaining = duration;

      const widget = document.getElementById("rest-timer-widget");
      const contextEl = document.getElementById("timer-context");
      if (contextEl) contextEl.textContent = labelText;
      if (widget) widget.classList.remove("hidden");

      updateTimerUI();
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timerRemaining -= 1;
        updateTimerUI();
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playTimerBeep();
          showToast("Temps de repos terminé — Prochaine série !", "success");
          setTimeout(() => {
            if (timerRemaining <= 0) {
              document.getElementById("rest-timer-widget")?.classList.add("hidden");
            }
          }, 1800);
        }
      }, 1000);
    };

    function updateTimerUI() {
      const countEl = document.getElementById("timer-countdown");
      const barEl = document.getElementById("timer-progress-bar");
      if (countEl) countEl.textContent = formatSeconds(timerRemaining);
      if (barEl && timerTotal > 0) {
        const pct = Math.max(0, Math.min(100, (timerRemaining / timerTotal) * 100));
        barEl.style.width = `${pct}%`;
      }
    }

    window.adjustRestTimer = function(deltaSec) {
      timerRemaining = Math.max(5, timerRemaining + deltaSec);
      if (timerRemaining > timerTotal) timerTotal = timerRemaining;
      updateTimerUI();
    };

    window.stopRestTimer = function() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerRemaining = 0;
      document.getElementById("rest-timer-widget")?.classList.add("hidden");
    };

    // -------------------------------------------------------------------------
    // 4. TOAST & MODAL HELPERS
    // -------------------------------------------------------------------------
    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const styles = {
        success: "bg-emerald-950/95 border-emerald-400/40 text-emerald-200",
        error: "bg-rose-950/95 border-rose-400/40 text-rose-200",
        info: "bg-slate-900/95 border-sky-400/40 text-sky-100"
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto border rounded-xl px-4 py-3 text-xs sm:text-sm font-medium shadow-xl transition ${styles[type] || styles.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-6px)";
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById("modal-backdrop");
      const card = document.getElementById("modal-card");
      if (!backdrop || !card) return;
      card.innerHTML = htmlContent;
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
    }

    window.closeModal = function() {
      const backdrop = document.getElementById("modal-backdrop");
      if (!backdrop) return;
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    };

    document.getElementById("modal-backdrop")?.addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });

    // -------------------------------------------------------------------------
    // 5. ATHLETE & COACH ACTIONS
    // -------------------------------------------------------------------------
    function getAthleteById(id) {
      return appState.athletes.find((a) => a.id === id) || appState.athletes[0];
    }

    window.loginAthleteByCode = function(event) {
      event.preventDefault();
      const input = document.getElementById("athlete-code-input");
      const rawCode = (input?.value || "").trim().toUpperCase();
      const found = appState.athletes.find((a) => a.code.toUpperCase() === rawCode);
      if (!found) {
        showToast("Code athlète introuvable. Essaye LUCAS-2026 ou CHLOE-2026.", "error");
        return;
      }
      session.role = "athlete";
      session.athleteId = found.id;
      session.athleteActiveTab = "workout";
      showToast(`Bienvenue ${found.name} !`, "success");
      render();
    };

    window.quickFillAthleteCode = function(code) {
      const input = document.getElementById("athlete-code-input");
      if (input) input.value = code;
    };

    window.loginCoach = function(event) {
      event.preventDefault();
      const email = (document.getElementById("coach-email-input")?.value || "").trim().toLowerCase();
      const password = (document.getElementById("coach-password-input")?.value || "").trim();
      if (email === "coach@btraining.fr" && password === "admin") {
        session.role = "coach";
        session.coachActiveTab = "athletes";
        if (!session.selectedCoachAthleteId && appState.athletes[0]) {
          session.selectedCoachAthleteId = appState.athletes[0].id;
        }
        showToast("Connexion Coach validée.", "success");
        render();
      } else {
        showToast("Identifiants Coach invalides (coach@btraining.fr / admin).", "error");
      }
    };

    window.logoutSession = function() {
      stopRestTimer();
      session.role = null;
      session.athleteId = null;
      render();
    };

    window.toggleAthleteSet = function(athleteId, workoutId, exerciseId, setIndex) {
      const next = structuredClone(appState);
      const ath = next.athletes.find((a) => a.id === athleteId);
      if (!ath) return;
      const wk = ath.workouts.find((w) => w.id === workoutId);
      if (!wk) return;
      const ex = wk.exercises.find((e) => e.id === exerciseId);
      if (!ex) return;

      if (!Array.isArray(ex.completedSets)) {
        ex.completedSets = Array.from({ length: ex.setsCount }, () => false);
      }

      const willComplete = !ex.completedSets[setIndex];
      ex.completedSets[setIndex] = willComplete;
      persistState(next);

      if (willComplete) {
        const restDuration = ex.restSec || wk.restDefault || 90;
        startRestTimer(restDuration, `${ex.name} • Série ${setIndex + 1}/${ex.setsCount} validée`);
      }
    };

    window.updateLoggedLoad = function(athleteId, workoutId, exerciseId, setIndex, value) {
      const next = structuredClone(appState);
      const ath = next.athletes.find((a) => a.id === athleteId);
      const wk = ath?.workouts.find((w) => w.id === workoutId);
      const ex = wk?.exercises.find((e) => e.id === exerciseId);
      if (!ex) return;
      if (!Array.isArray(ex.loggedLoads)) ex.loggedLoads = [];
      ex.loggedLoads[setIndex] = value;

    window.addAthleteCheckin = function(event, athleteId) {
      event.preventDefault();
      const weightKg = parseFloat(document.getElementById("checkin-weight")?.value);
      const bodyFatPct = parseFloat(document.getElementById("checkin-bf")?.value);
      const sleepHours = parseFloat(document.getElementById("checkin-sleep")?.value);
      const notes = (document.getElementById("checkin-notes")?.value || "").trim();

      const calories = parseInt(document.getElementById("nut-calories")?.value, 10);
      const proteinG = parseInt(document.getElementById("nut-protein")?.value, 10);
      const carbsG = parseInt(document.getElementById("nut-carbs")?.value, 10);
      const fatsG = parseInt(document.getElementById("nut-fats")?.value, 10);
      const waterL = parseFloat(document.getElementById("nut-water")?.value);

      const next = structuredClone(appState);
      const ath = next.athletes.find((a) => a.id === athleteId);
      if (!ath) return;

      const today = new Date().toISOString().slice(0, 10);
      if (!Number.isNaN(weightKg)) {
        ath.biometrics.push({
          id: "bio_" + Date.now(),
          date: today,
          weightKg,
          bodyFatPct: Number.isNaN(bodyFatPct) ? null : bodyFatPct,
          sleepHours: Number.isNaN(sleepHours) ? 7.5 : sleepHours,
          rhrBpm: 55,
          notes: notes || "Check-in enregistré"
        });
      }

      if (!Number.isNaN(calories) || !Number.isNaN(proteinG)) {
        ath.nutritionLogs.push({
          id: "nut_" + Date.now(),
          date: today,
          calories: Number.isNaN(calories) ? 2800 : calories,
          proteinG: Number.isNaN(proteinG) ? 160 : proteinG,
          carbsG: Number.isNaN(carbsG) ? 300 : carbsG,
          fatsG: Number.isNaN(fatsG) ? 75 : fatsG,
          waterL: Number.isNaN(waterL) ? 2.5 : waterL,
          adherencePct: 95
        });
      }

      persistState(next);
      showToast("Check-in biométrique & nutritionnel enregistré !", "success");
    };

    window.assignExerciseToAthlete = function(event) {
      event.preventDefault();
      const athleteId = document.getElementById("assign-athlete-select")?.value;
      const workoutTitle = (document.getElementById("assign-workout-title")?.value || "Séance Personnalisée").trim();
      const name = (document.getElementById("assign-ex-name")?.value || "").trim();
      const machine = (document.getElementById("assign-ex-machine")?.value || "Équipement standard").trim();
      const setsCount = Math.max(1, Math.min(8, parseInt(document.getElementById("assign-ex-sets")?.value, 10) || 3));
      const repsTarget = (document.getElementById("assign-ex-reps")?.value || "8-12 reps").trim();
      const loadHint = (document.getElementById("assign-ex-load")?.value || "À calibrer").trim();
      const restSec = Math.max(15, parseInt(document.getElementById("assign-ex-rest")?.value, 10) || 90);
      const videoUrl = (document.getElementById("assign-ex-video")?.value || "").trim();
      const executionTip = (document.getElementById("assign-ex-exec")?.value || "Contrôle de la charge sur toute l'amplitude.").trim();
      const machineTip = (document.getElementById("assign-ex-machinetip")?.value || "Vérifier l'alignement articulaire avant de démarrer.").trim();

      if (!name) {
        showToast("Indique le nom de l'exercice.", "error");
        return;
      }

      const next = structuredClone(appState);
      const ath = next.athletes.find((a) => a.id === athleteId);
      if (!ath) return;

      let wk = ath.workouts.find((w) => w.title.toLowerCase() === workoutTitle.toLowerCase());
      if (!wk) {
        wk = {
          id: "wk_" + Date.now(),
          title: workoutTitle,
          focus: ath.sport,
          restDefault: restSec,
          exercises: []
        };
        ath.workouts.push(wk);
      }

      wk.exercises.push({
        id: "ex_" + Date.now(),
        name,
        machine,
        setsCount,
        repsTarget,
        loadHint,
        restSec,
        videoUrl,
        executionTip,
        machineTip,
        completedSets: Array.from({ length: setsCount }, () => false),
        loggedLoads: Array.from({ length: setsCount }, () => `${loadHint} x ?`)
      });

      persistState(next);
      showToast(`Exercice "${name}" assigné à ${ath.name} !`, "success");
    };

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <form onsubmit="assignExerciseToAthlete(event)" class="lg:col-span-6 glass-panel rounded-2xl p-5 space-y-3.5">
            <h2 class="text-base font-bold text-white">Assigner un Exercice + Guide Machine / Vidéo</h2>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Athlète cible</label>
              <select id="assign-athlete-select" onchange="selectCoachAthlete(this.value)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white">
                ${appState.athletes.map((a) => `<option value="${a.id}" ${a.id === selectedAth?.id ? "selected" : ""}>${escapeHtml(a.name)} (${escapeHtml(a.code)})</option>`).join("")}
              </select>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Nom de la séance</label>
              <input id="assign-workout-title" type="text" value="${escapeHtml(defaultWorkoutTitle)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Exercice</label>
                <input id="assign-ex-name" type="text" required placeholder="Ex : Rowing Barre" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Machine / Matériel</label>
                <input id="assign-ex-machine" type="text" placeholder="Ex : Barre olympique + disques" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Séries</label>
                <input id="assign-ex-sets" type="number" min="1" max="8" value="4" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Reps cibles</label>
                <input id="assign-ex-reps" type="text" value="8-12 reps" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Charge repère</label>
                <input id="assign-ex-load" type="text" value="60 kg" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Repos (sec)</label>
                <input id="assign-ex-rest" type="number" min="15" max="300" value="90" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Lien vidéo d'exécution (optionnel)</label>
              <input id="assign-ex-video" type="url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Conseil d'exécution</label>
              <textarea id="assign-ex-exec" rows="2" placeholder="Amplitude, tempo, respiration..." class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"></textarea>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Réglage machine & sécurité</label>
              <textarea id="assign-ex-machinetip" rows="2" placeholder="Hauteur siège, butées, placement pieds..." class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"></textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-sm transition">
              Assigner à la séance de l'athlète
            </button>
          </form>

          <div class="lg:col-span-6 space-y-4">
            <h2 class="text-base font-bold text-white">Programme actuel de ${escapeHtml(selectedAth?.name || "")}</h2>
            ${(selectedAth?.workouts || []).map((wk) => `
              <div class="glass-panel rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between gap-2">
                  <div>
                    <h3 class="font-bold text-white">${escapeHtml(wk.title)}</h3>
                    <p class="text-xs text-slate-400">${escapeHtml(wk.focus)} • Repos par défaut : ${wk.restDefault}s</p>
                  </div>
                  <span class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300 font-semibold">${wk.exercises.length} exos</span>
                </div>
                <div class="space-y-2">
                  ${wk.exercises.map((ex) => {
                    const doneCount = (ex.completedSets || []).filter(Boolean).length;
                    return `
                      <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between gap-3">
                        <div class="min-w-0">
                          <p class="text-sm font-semibold text-slate-100 truncate">${escapeHtml(ex.name)}</p>
                          <p class="text-xs text-slate-400">${ex.setsCount} × ${escapeHtml(ex.repsTarget)} • ${escapeHtml(ex.loadHint)} • Repos ${ex.restSec}s</p>
                        </div>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${doneCount === ex.setsCount ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-300'}">
                          ${doneCount}/${ex.setsCount} séries
                        </span>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderCoachTrackingTab(selectedAth) {
      return `
        <div class="glass-panel rounded-2xl p-5 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg font-bold text-white">Suivi Biométrique & Nutritionnel — ${escapeHtml(selectedAth?.name || "")}</h2>
              <p class="text-xs text-slate-400">Objectif : ${escapeHtml(selectedAth?.objective || "")}</p>
            </div>
            <select onchange="selectCoachAthlete(this.value)" class="px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-semibold text-white">
              ${appState.athletes.map((a) => `<option value="${a.id}" ${a.id === selectedAth?.id ? "selected" : ""}>${escapeHtml(a.name)}</option>`).join("")}
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="bg-slate-950/75 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h3 class="text-sm font-bold text-sky-300 uppercase tracking-wider">Historique Biométrique</h3>
              ${(selectedAth?.biometrics || []).slice().reverse().map((b) => `
                <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800/80 text-xs space-y-1">
                  <div class="flex justify-between font-bold text-slate-200">
                    <span>${escapeHtml(b.date)}</span>
                    <span class="text-emerald-300">${b.weightKg} kg ${b.bodyFatPct ? `• ${b.bodyFatPct}% MG` : ""}</span>
                  </div>
                  <p class="text-slate-400">Sommeil : ${b.sleepHours}h • ${escapeHtml(b.notes || "")}</p>
                </div>
              `).join("")}
            </div>

            <div class="bg-slate-950/75 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h3 class="text-sm font-bold text-emerald-300 uppercase tracking-wider">Logs Nutritionnels</h3>
              ${(selectedAth?.nutritionLogs || []).slice().reverse().map((n) => `
                <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800/80 text-xs space-y-1">
                  <div class="flex justify-between font-bold text-slate-200">
                    <span>${escapeHtml(n.date)}</span>
                    <span class="text-sky-300">${n.calories} kcal</span>
                  </div>
                  <p class="text-slate-400">P: ${n.proteinG}g • G: ${n.carbsG}g • L: ${n.fatsG}g • Eau: ${n.waterL}L</p>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderAthleteDashboard() {
      const ath = getAthleteById(session.athleteId);
      const latestBio = ath.biometrics[ath.biometrics.length - 1];
      const latestNut = ath.nutritionLogs[ath.nutritionLogs.length - 1];

      return `
        <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 pb-28 space-y-6">
          <!-- Athlete Header Card -->
          <div class="glass-panel rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-sky-400">${escapeHtml(ath.sport)}</span>
              <h1 class="text-xl sm:text-2xl font-extrabold text-white mt-0.5">${escapeHtml(ath.name)}</h1>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">${escapeHtml(ath.objective)}</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="setAthleteTab('workout')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition ${session.athleteActiveTab === 'workout' ? 'bg-sky-500 text-slate-950' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}">
                Séance & Repos
              </button>
              <button type="button" onclick="setAthleteTab('tracking')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition ${session.athleteActiveTab === 'tracking' ? 'bg-emerald-400 text-slate-950' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}">
                Biométrie & Nutrition
              </button>
            </div>
          </div>

          ${session.athleteActiveTab === "workout"
            ? renderAthleteWorkouts(ath)
            : renderAthleteTracking(ath, latestBio, latestNut)}
        </main>
      `;
    }

    window.setAthleteTab = function(tab) {
      session.athleteActiveTab = tab;
      render();
    };

    function renderAthleteWorkouts(ath) {
      return `
        <div class="space-y-6">
          ${ath.workouts.map((wk) => `
            <section class="space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="text-lg font-extrabold text-white">${escapeHtml(wk.title)}</h2>
                  <p class="text-xs text-slate-400">${escapeHtml(wk.focus)} • Repos auto : ${wk.restDefault}s par défaut</p>
                </div>
                <button type="button" onclick="commitLoggedLoads()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-sky-300 border border-slate-700 transition">
                  Sauvegarder les charges
                </button>
              </div>

              <div class="space-y-4">
                ${wk.exercises.map((ex) => {
                  const completedArr = Array.from({ length: ex.setsCount }, (_, i) => Boolean(ex.completedSets?.[i]));
                  const loadsArr = Array.from({ length: ex.setsCount }, (_, i) => ex.loggedLoads?.[i] || `${ex.loadHint} x ${ex.repsTarget}`);
                  return `
                    <article class="glass-panel rounded-2xl p-4 sm:p-5 space-y-4 border border-slate-800">
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <h3 class="text-base sm:text-lg font-bold text-white">${escapeHtml(ex.name)}</h3>
                          <p class="text-xs text-slate-400 mt-0.5">${escapeHtml(ex.machine || "Matériel libre")} • Cible : <strong class="text-slate-200">${ex.setsCount} × ${escapeHtml(ex.repsTarget)}</strong> • Repos : <strong class="text-sky-300">${ex.restSec || wk.restDefault}s</strong></p>
                        </div>
                        <button type="button" onclick="openExerciseGuideModal('${ath.id}', '${wk.id}', '${ex.id}')" class="px-3.5 py-2 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-400/35 text-xs font-bold text-sky-300 shrink-0 transition">
                          Guide Machine & Vidéo
                        </button>
                      </div>

                      <!-- Quick Execution & Machine Tip Callout -->
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                        <div class="p-3 rounded-xl bg-slate-950/75 border border-slate-800/80">
                          <span class="font-bold text-emerald-300 block mb-0.5">Exécution</span>
                          <span class="text-slate-300 line-clamp-2">${escapeHtml(ex.executionTip)}</span>
                        </div>
                        <div class="p-3 rounded-xl bg-slate-950/75 border border-slate-800/80">
                          <span class="font-bold text-sky-300 block mb-0.5">Réglage Machine</span>
                          <span class="text-slate-300 line-clamp-2">${escapeHtml(ex.machineTip)}</span>
                        </div>
                      </div>

                      <!-- Interactive Sets Checkmarks (Auto-starts rest timer when checked) -->
                      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                        ${completedArr.map((isDone, idx) => `
                          <label class="flex items-center justify-between gap-2 p-3 rounded-xl border cursor-pointer transition ${isDone ? 'bg-emerald-500/15 border-emerald-400/40' : 'bg-slate-950/80 border-slate-800 hover:border-slate-700'}">
                            <div class="flex items-center gap-2.5 min-w-0">
                              <input
                                type="checkbox"
                                ${isDone ? "checked" : ""}
                                onchange="toggleAthleteSet('${ath.id}', '${wk.id}', '${ex.id}', ${idx})"
                                class="set-checkbox h-5 w-5 rounded-md border-slate-600 bg-slate-900 text-emerald-500 focus:ring-emerald-400 shrink-0 cursor-pointer"
                              />
                              <div class="min-w-0">
                                <span class="text-xs font-bold block ${isDone ? 'text-emerald-300' : 'text-slate-200'}">Série ${idx + 1}</span>
                                <input
                                  type="text"
                                  value="${escapeHtml(loadsArr[idx])}"
                                  onchange="updateLoggedLoad('${ath.id}', '${wk.id}', '${ex.id}', ${idx}, this.value)"
                                  onclick="event.stopPropagation()"
                                  class="w-full bg-transparent text-xs text-slate-400 focus:text-white focus:outline-none truncate"
                                  aria-label="Charge série ${idx + 1}"
                                />
                              </div>
                            </div>
                          </label>
                        `).join("")}
                      </div>
                    </article>
                  `;
                }).join("")}
              </div>
            </section>
          `).join("")}
        </div>
      `;
    }

    function renderAthleteTracking(ath, latestBio, latestNut) {
      const target = ath.nutritionTarget || { calories: 2900, proteinG: 170, carbsG: 320, fatsG: 80, waterL: 3.0 };
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Check-in Form -->
          <form onsubmit="addAthleteCheckin(event, '${ath.id}')" class="lg:col-span-6 glass-panel rounded-2xl p-5 space-y-4">
            <h2 class="text-base font-bold text-white">Nouveau Check-in Biométrique & Nutritionnel</h2>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Poids (kg)</label>
                <input id="checkin-weight" type="number" step="0.1" value="${latestBio?.weightKg ?? 78.0}" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">% MG</label>
                <input id="checkin-bf" type="number" step="0.1" value="${latestBio?.bodyFatPct ?? 13.0}" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Sommeil (h)</label>
                <input id="checkin-sleep" type="number" step="0.1" value="${latestBio?.sleepHours ?? 7.8}" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Ressenti / Notes biométriques</label>
              <input id="checkin-notes" type="text" placeholder="Énergie, courbatures, récupération..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
            </div>

            <div class="pt-2 border-t border-slate-800">
              <p class="text-xs font-bold text-emerald-300 uppercase tracking-wider mb-2.5">Apports Nutritionnels du Jour (Cible : ${target.calories} kcal)</p>
              <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Kcal</label>
                  <input id="nut-calories" type="number" value="${latestNut?.calories ?? target.calories}" class="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Prot (g)</label>
                  <input id="nut-protein" type="number" value="${latestNut?.proteinG ?? target.proteinG}" class="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Gluc (g)</label>
                  <input id="nut-carbs" type="number" value="${latestNut?.carbsG ?? target.carbsG}" class="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Lip (g)</label>
                  <input id="nut-fats" type="number" value="${latestNut?.fatsG ?? target.fatsG}" class="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-[11px] text-slate-400 mb-1">Eau (L)</label>
                  <input id="nut-water" type="number" step="0.1" value="${latestNut?.waterL ?? target.waterL}" class="w-full px-2.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
                </div>
              </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-400 to-emerald-400 text-slate-950 font-extrabold text-sm transition">
              Enregistrer mon check-in
            </button>
          </form>

          <!-- Recent Logs Summary -->
          <div class="lg:col-span-6 space-y-4">
            <div class="glass-panel rounded-2xl p-5 space-y-3">
              <h3 class="text-sm font-bold text-sky-300 uppercase tracking-wider">Derniers relevés biométriques</h3>
              ${ath.biometrics.slice().reverse().slice(0, 4).map((b) => `
                <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between text-xs">
                  <div>
                    <p class="font-bold text-white">${escapeHtml(b.date)} — ${b.weightKg} kg</p>
                    <p class="text-slate-400">${escapeHtml(b.notes || "")}</p>
                  </div>
                  <span class="text-emerald-300 font-semibold">${b.sleepHours}h sommeil</span>
                </div>
              `).join("")}
            </div>

            <div class="glass-panel rounded-2xl p-5 space-y-3">
              <h3 class="text-sm font-bold text-emerald-300 uppercase tracking-wider">Derniers logs nutritionnels</h3>
              ${ath.nutritionLogs.slice().reverse().slice(0, 4).map((n) => `
                <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between text-xs">
                  <div>
                    <p class="font-bold text-white">${escapeHtml(n.date)} — ${n.calories} kcal</p>
                    <p class="text-slate-400">Prot ${n.proteinG}g • Gluc ${n.carbsG}g • Lip ${n.fatsG}g</p>
                  </div>
                  <span class="text-sky-300 font-semibold">${n.waterL}L eau</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (!root) return;

      let screenHtml = "";
      if (!session.role) {
        screenHtml = renderLoginScreen();
      } else if (session.role === "coach") {
        screenHtml = renderCoachDashboard();
      } else {
        screenHtml = renderAthleteDashboard();
      }

      root.innerHTML = renderTopBar() + screenHtml;
      updateConnectionBadge();
    }

    // Boot application & connect Firestore
    render();
    initFirebaseSync();
  </script>
</body>
</html>
